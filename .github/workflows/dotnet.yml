name: .NET

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Backend Build and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore StartingPoint/StartingPoint.sln

      - name: Build
        run: dotnet build StartingPoint/StartingPoint.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test StartingPoint/StartingPoint.sln --no-build --configuration Release
